[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "demucs"
description = "Music source separation in the waveform domain."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8.0"
authors = [
    { name = "Alexandre Défossez", email = "defossez@fb.com" },
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "dora-search",
    "einops",
    "julius>=0.2.3",
    "lameenc>=1.2",
    # torch <=2.1 imports `pkg_resources` at runtime (via einops/torch_version);
    # setuptools 81 dropped it. Pin so resolves stay self-consistent.
    "setuptools<81",
    # torch 2.1.x was compiled against NumPy 1.x; using NumPy 2 segfaults
    # `torch.from_numpy`. Lift only if we bump torch >= 2.2.
    "numpy<2",
    "openunmix",
    "pyyaml",
    # Hard-pinned: torch 2.1.2 is the last release that works with NumPy 1.x
    # (see numpy<2 above) and the broader demucs stack. Bumping requires
    # also relaxing setuptools<81 and numpy<2.
    "torch==2.1.2",
    "torchaudio==2.1.2",
    "tqdm",
]
dynamic = ["version"]

[project.optional-dependencies]
server = [
    "fastapi",
    "uvicorn",
    "python-multipart",
    "soundfile>=0.10.3",
]
client = [
    "requests",
    "soundfile>=0.10.3",
]
pool = [
    "fastapi",
    "uvicorn",
    "python-multipart",
    "soundfile>=0.10.3",
    "submitit",
    "pydantic",
    "tomli ; python_version < '3.11'",
]
dev = [
    "dora-search>=0.1.12",
    "diffq>=0.2.1",
    "einops",
    "flake8",
    "hydra-colorlog>=1.1",
    "hydra-core>=1.1",
    "julius>=0.2.3",
    "lameenc>=1.2",
    "museval",
    "mypy",
    "setuptools<81",
    "numpy<2",
    "openunmix",
    "pyyaml",
    "submitit",
    "torch==2.1.2",
    "torchaudio==2.1.2",
    "tqdm",
    "treetable",
    "soundfile>=0.10.3",
]

[project.urls]
Homepage = "https://github.com/facebookresearch/demucs"

[project.scripts]
demucs = "demucs.separate:main"
demucs-server = "demucs.server:main"
demucs-pool = "demucs.pool:main"

[tool.hatch.version]
path = "demucs/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["demucs"]

[tool.hatch.build.targets.sdist]
include = [
    "demucs/",
    "conf/**/*.yaml",
    "Makefile",
    "LICENSE",
    "README.md",
    "demucs.png",
    "outputs.tar.gz",
    "test.mp3",
    "requirements.txt",
    "requirements_minimal.txt",
    "mypy.ini",
]
